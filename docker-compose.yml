version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: akmart_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: akmart_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://akmart_user:change_me@postgres:5432/akmart_db?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - PORT=5000
      - JWT_ACCESS_SECRET=replace_with_strong_random_secret
      - JWT_REFRESH_SECRET=replace_with_strong_random_secret
      - GOOGLE_CLIENT_ID=dummy_google_client_id
      - GOOGLE_CLIENT_SECRET=dummy_google_client_secret
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
