services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: akmart_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: akmart_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://akmart_user:change_me@postgres:5432/akmart_db?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - PORT=5000
      - JWT_ACCESS_SECRET=replace_with_strong_random_secret
      - JWT_REFRESH_SECRET=replace_with_strong_random_secret
      - GOOGLE_CLIENT_ID=dummy_google_client_id
      - GOOGLE_CLIENT_SECRET=dummy_google_client_secret
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/akmart-media;
      /usr/bin/mc anonymous set download myminio/akmart-media;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
