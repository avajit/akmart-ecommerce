version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: akmart_user
      POSTGRES_PASSWORD: akmart_password
      POSTGRES_DB: akmart_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://akmart_user:akmart_password@postgres:5432/akmart_db?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - PORT=5000
      - JWT_ACCESS_SECRET=super_secret_access_key_change_me_in_prod
      - JWT_REFRESH_SECRET=super_secret_refresh_key_change_me_in_prod
      - GOOGLE_CLIENT_ID=dummy_google_client_id
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
