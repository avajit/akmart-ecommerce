name: Backend CI / Build & Publish

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/akmart-ecommerce-backend:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Skip GHCR publish if token is not configured
        if: ${{ secrets.GHCR_TOKEN == '' }}
        run: |
          echo "GHCR_TOKEN is not configured. Skipping image push and deployment publish."

      - name: Log in to GitHub Container Registry
        if: ${{ secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        if: ${{ secrets.GHCR_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Run migrations (one-off)
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker pull ${{ env.IMAGE_NAME }}
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            ${{ env.IMAGE_NAME }} \
            sh -c "npx prisma generate && npx prisma migrate deploy"

      - name: Skip migrations if DATABASE_URL is not configured
        if: ${{ secrets.DATABASE_URL == '' }}
        run: |
          echo "DATABASE_URL is not configured. Skipping Prisma migration step."
