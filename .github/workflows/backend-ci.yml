name: Backend CI / Build & Publish

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/akmart-ecommerce-backend:latest

      - name: Run migrations (one-off)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/akmart-ecommerce-backend:latest
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            ghcr.io/${{ github.repository_owner }}/akmart-ecommerce-backend:latest \
            sh -c "npx prisma generate && npx prisma migrate deploy"
