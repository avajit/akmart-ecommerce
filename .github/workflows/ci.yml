name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Spin up ephemeral PostgreSQL & Redis for tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: akmart
          POSTGRES_PASSWORD: password
          POSTGRES_DB: akmart_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: Backend/package-lock.json

    - name: Install dependencies
      working-directory: ./Backend
      run: npm ci

    - name: Run Prisma Migrate
      working-directory: ./Backend
      env:
        DATABASE_URL: postgresql://akmart:password@localhost:5432/akmart_test_db?schema=public
      run: npx prisma migrate dev --name init

    - name: Create .env.test
      working-directory: ./Backend
      run: |
        cat << EOF > .env.test
        DATABASE_URL="postgresql://akmart:password@localhost:5432/akmart_test_db?schema=public"
        REDIS_URL="redis://localhost:6379"
        PORT=5001
        NODE_ENV="test"
        JWT_ACCESS_SECRET="super_secret_test_access_key_12345"
        JWT_REFRESH_SECRET="super_secret_test_refresh_key_12345"
        JWT_ACCESS_EXPIRES_IN="15m"
        JWT_REFRESH_EXPIRES_IN="7d"
        JWT_REFRESH_EXPIRES_IN_MS=604800000
        OTP_EXPIRES_IN_MS=900000
        BCRYPT_SALT_ROUNDS=12
        DEFAULT_USER_ROLE="CONSUMER"
        SMTP_HOST="smtp.ethereal.email"
        SMTP_PORT=587
        SMTP_USER="test_user"
        SMTP_PASS="test_pass"
        SMTP_FROM='"AKMart Test" <test@akmart.com>'
        FRONTEND_WEB_URL="http://localhost:5173"
        FRONTEND_MOBILE_URL="com.akmart.app"
        RATE_LIMIT_WINDOW_MS=60000
        RATE_LIMIT_MAX_REQUESTS=100
        AUTH_RATE_LIMIT_WINDOW_MS=900000
        AUTH_RATE_LIMIT_MAX_REQUESTS=5
        EOF

    - name: Run Unit, Integration, E2E & Security Tests
      working-directory: ./Backend
      run: npm run test
