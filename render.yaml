services:
  - type: web
    name: akmart-ecommerce-backend
    env: node
    plan: free
    rootDir: Backend
    buildCommand: npm install && npm run build
    startCommand: sh ./start.sh
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        value: "postgresql://user:password@host:5432/dbname?sslmode=require"
      - key: REDIS_URL
        value: "redis://default:password@host:6379"
      - key: JWT_ACCESS_SECRET
        value: "super_secret_access_key_change_me_in_prod"
      - key: JWT_REFRESH_SECRET
        value: "super_secret_refresh_key_change_me_in_prod"
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: GOOGLE_CLIENT_ID
        value: "dummy_google_client_id"
      - key: GOOGLE_CLIENT_SECRET
        value: "dummy_google_client_secret"
      - key: GOOGLE_CALLBACK_URL
        value: "https://akmart-ecommerce-backend.onrender.com/api/v1/auth/google/callback"
      - key: FRONTEND_WEB_URL
        value: "https://localhost:5173"
      - key: FRONTEND_MOBILE_URL
        value: "com.akmart.app"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "mandalavijeet12@gmail.com"
      - key: SMTP_PASS
        value: "REDACTED_APP_PASSWORD"
      - key: SMTP_FROM
        value: "\"AKMart\" <noreply@akmart.com>"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "1000"
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: "100"
