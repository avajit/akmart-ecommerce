services:
  - type: web
    name: akmart-ecommerce-backend
    env: node
    plan: free
    rootDir: Backend
    buildCommand: npm install && npm run build
    startCommand: sh ./start.sh
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        value: "postgresql://USER:PASSWORD@HOST:PORT/DATABASE?sslmode=require"
      - key: REDIS_URL
        value: "redis://:PASSWORD@HOST:PORT"
      - key: JWT_ACCESS_SECRET
        value: "replace_with_strong_random_secret"
      - key: JWT_REFRESH_SECRET
        value: "replace_with_strong_random_secret"
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: GOOGLE_CLIENT_ID
        value: "your_google_client_id"
      - key: GOOGLE_CLIENT_SECRET
        value: "your_google_client_secret"
      - key: GOOGLE_CALLBACK_URL
        value: "https://your-backend-url.example.com/api/v1/auth/google/callback"
      - key: FRONTEND_WEB_URL
        value: "https://your-frontend-url.example.com"
      - key: FRONTEND_MOBILE_URL
        value: "com.akmart.app"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "your_email@example.com"
      - key: SMTP_PASS
        value: "your_app_password_here"
      - key: SMTP_FROM
        value: "\"AKMart\" <noreply@akmart.com>"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "1000"
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: "100"
