config:
  target: "http://localhost:5000"
  phases:
    - duration: 30
      arrivalRate: 10
      rampTo: 50
      name: "Spike to 50 logins per second"
  
  # Ensure invalid logins don't crash the server, but trigger the Redis Rate Limiter
scenarios:
  - name: "Brute Force Login Attempt"
    flow:
      - post:
          url: "/api/v1/auth/login"
          json:
            email: "fakeuser@example.com"
            password: "wrongpassword123"
          expect:
            # First 5 will be 401. Next will be 429 (Rate Limited)
            - statusCode: [401, 429]
